---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: storage
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.11.2
    helm:
      skipCrds: true
      valuesObject:
        preUpgradeChecker:
          jobEnabled: false
        persistence:
          defaultClass: true
          defaultClassReplicaCount: 3
        defaultSettings:
          backupTarget: "s3://homelab@auto/longhorn-backups/"
          backupTargetCredentialSecret: longhorn-backup-target
          defaultReplicaCount: 3
          guaranteedInstanceManagerCpu: 12
          # Throttle concurrent rebuilds so node cordon/reboot does not trigger
          # a replica-rebuild I/O storm on the pve-01 consumer NVMe (etcd contention trigger).
          concurrentReplicaRebuildPerNodeLimit: 1
        ingress:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        expose: internal
        pod-security.kubernetes.io/enforce: privileged
        trust.cert-manager.io/inject: "true"
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
