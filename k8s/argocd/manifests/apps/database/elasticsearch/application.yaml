---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elasticsearch
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: database
  sources:
    - repoURL: https://helm.elastic.co
      chart: eck-operator
      targetRevision: 3.3.1
    - repoURL: https://github.com/pressogh/homelab.git
      targetRevision: main
      path: k8s/elasticsearch
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        expose: internal
        trust.cert-manager.io/inject: "true"
