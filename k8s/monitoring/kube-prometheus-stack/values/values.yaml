crds:
  enabled: true

alertmanager:
  enabled: true

  route:
    main:
      enabled: false

  alertmanagerSpec:
    image:
      registry: quay.io
      repository: prometheus/alertmanager
      tag: v0.28.1
      pullPolicy: IfNotPresent

    replicas: 2
    retention: 120h

    externalUrl: https://alertmanager.home.arpa

    storage:
     volumeClaimTemplate:
       spec:
         storageClassName: longhorn
         accessModes: ["ReadWriteOnce"]
         resources:
           requests:
             storage: 5Gi

    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        cpu: 400m
        memory: 800Mi

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

  serviceAccount:
    create: true
    automountServiceAccountToken: false

grafana:
  enabled: true

  defaultDashboardsTimezone: Asia/Seoul
  defaultDashboardsInterval: 1m

  adminUser: admin
  adminPassword: prom-operator

  ingress:
    enabled: false

  grafana.ini:
    server:
      domain: grafana.home.arpa
      root_url: https://grafana.home.arpa
      serve_from_sub_path: false
    security:
      cookie_secure: true
      allow_embedding: false
      disable_gravatar: true

  persistence:
    enabled: true
    type: sts
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    finalizers:
      - kubernetes.io/pvc-protection

  serviceMonitor:
    enabled: true

  serviceAccount:
    create: true
    automountServiceAccountToken: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

nodeExporter:
  enabled: true

  operatingSystems:
    linux:
      enabled: true
    aix:
      enabled: true
    darwin:
      enabled: true

  serviceAccount:
    create: true
    automountServiceAccountToken: false

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheusOperator:
  enabled: true

  revisionHistoryLimit: 10

  tls:
    enabled: true
    tlsMinVersion: VersionTLS13
    internalPort: 10250

  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true

  admissionWebhooks:
    enabled: true
    failurePolicy: ""
    timeoutSeconds: 10
    deployment:
      enabled: true
    patch:
      enabled: true
      image:
        registry: registry.k8s.io
        repository: ingress-nginx/kube-webhook-certgen
        tag: v1.6.3
      ttlSecondsAfterFinished: 60

  namespaces: {}
  denyNamespaces: []

  networkPolicy:
    enabled: false
    flavor: cilium
    cilium:
      endpointSelector: {}
      egress:
        - {}
      ingress:
        - {}

  serviceAccount:
    create: true
    automountServiceAccountToken: true

  serviceMonitor:
    selfMonitor: true

  env:
    GOGC: "30"

  image:
    registry: quay.io
    repository: prometheus-operator/prometheus-operator
    pullPolicy: IfNotPresent

  hostNetwork: false

  securityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ "ALL" ]

prometheus:
  enabled: true

  route:
    main:
      enabled: false

  service:
    enabled: true
    type: ClusterIP
    port: 9090

  ingress:
    enabled: false

  serviceMonitor:
    selfMonitor: true

  networkPolicy:
    enabled: false
    flavor: cilium
    cilium:
      endpointSelector: {}
      egress:
        - {}
      ingress:
        - {}

  prometheusSpec:
    image:
      registry: quay.io
      repository: prometheus/prometheus
      tag: v3.6.0

    replicas: 2
    shards: 1

    retention: 10d
    walCompression: true
    enableAdminAPI: false
    externalUrl: https://prometheus.home.arpa

    serviceDiscoveryRole: EndpointSlice

    externalLabels:
      cluster: talos-homelab
      env: homelab

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    ruleSelectorNilUsesHelmValues: true
    serviceMonitorSelectorNilUsesHelmValues: true
    podMonitorSelectorNilUsesHelmValues: true
    probeSelectorNilUsesHelmValues: true
    scrapeConfigSelectorNilUsesHelmValues: true

    securityContext:
      runAsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault

    automountServiceAccountToken: true

  servicePerReplica:
    enabled: false

thanosRuler:
  enabled: false

cleanPrometheusOperatorObjectNames: false

extraManifests:
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: grafana
      namespace: {{ .Release.Namespace }}
      labels:
        app.kubernetes.io/part-of: {{ .Release.Namespace }}
    spec:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: internal-gw
          namespace: gateway-internal
      hostnames:
        - grafana.home.arpa
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          filters:
            - type: ResponseHeaderModifier
              responseHeaderModifier:
                add:
                  - name: Strict-Transport-Security
                    value: "max-age=31536000; includeSubDomains; preload"
                  - name: X-Content-Type-Options
                    value: "nosniff"
                  - name: X-Frame-Options
                    value: "DENY"
          backendRefs:
            - group: ""
              kind: Service
              name: kube-prometheus-stack-grafana
              port: 80
              weight: 1
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: alertmanager
      namespace: {{ .Release.Namespace }}
      labels:
        app.kubernetes.io/part-of: {{ .Release.Namespace }}
    spec:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: internal-gw
          namespace: gateway-internal
      hostnames:
        - alertmanager.home.arpa
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          filters:
            - type: ResponseHeaderModifier
              responseHeaderModifier:
                add:
                  - name: Strict-Transport-Security
                    value: "max-age=31536000; includeSubDomains; preload"
                  - name: X-Content-Type-Options
                    value: "nosniff"
                  - name: X-Frame-Options
                    value: "DENY"
          backendRefs:
            - group: ""
              kind: Service
              name: kube-prometheus-stack-alertmanager
              port: 9093
              weight: 1
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: prometheus
      namespace: {{ .Release.Namespace }}
      labels:
        app.kubernetes.io/part-of: {{ .Release.Namespace }}
    spec:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: internal-gw
          namespace: gateway-internal
      hostnames:
        - prometheus.home.arpa
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          filters:
            - type: ResponseHeaderModifier
              responseHeaderModifier:
                add:
                  - name: Strict-Transport-Security
                    value: "max-age=31536000; includeSubDomains; preload"
                  - name: X-Content-Type-Options
                    value: "nosniff"
                  - name: X-Frame-Options
                    value: "DENY"
          backendRefs:
            - group: ""
              kind: Service
              name: kube-prometheus-stack-prometheus
              port: 9090
              weight: 1