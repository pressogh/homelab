apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: elasticsearch-http-certs
  namespace: elastic-system
spec:
  secretName: elasticsearch-http-certs
  duration: 2160h  # 90 days
  renewBefore: 360h  # 15 days before expiry

  issuerRef:
    name: internal-ca
    kind: ClusterIssuer

  commonName: elasticsearch.elastic-system.svc.cluster.local

  dnsNames:
    - elasticsearch-es-http
    - elasticsearch-es-http.elastic-system.svc
    - elasticsearch-es-http.elastic-system.svc.cluster.local

  privateKey:
    algorithm: RSA
    size: 2048

  usages:
    - server auth
    - client auth
