apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: elastic-system
spec:
  version: 8.19.4
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  transport:
    tls:
      certificateAuthorities:
        configMapName: internal-ca-bundle
      selfSignedCertificates:
        disabled: true
  nodeSets:
    - name: masters
      count: 3
      config:
        node.roles: ["master"]
        node.store.allow_mmap: false
        action.auto_create_index: true
        xpack.security.transport.ssl.key: /usr/share/elasticsearch/config/cert-manager-certs/tls.key
        xpack.security.transport.ssl.certificate: /usr/share/elasticsearch/config/cert-manager-certs/tls.crt
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
            storageClassName: longhorn
      podTemplate:
        spec:
          securityContext:
            fsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: elasticsearch
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "2"
                  memory: 2Gi
                limits:
                  cpu: "4"
                  memory: 4Gi
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms1g -Xmx1g"
              volumeMounts:
                - name: transport-certs
                  mountPath: /usr/share/elasticsearch/config/cert-manager-certs
                  readOnly: true
          volumes:
            - name: transport-certs
              csi:
                driver: csi.cert-manager.io
                readOnly: true
                volumeAttributes:
                  csi.cert-manager.io/issuer-name: internal-ca
                  csi.cert-manager.io/issuer-kind: ClusterIssuer
                  csi.cert-manager.io/dns-names: "*.elasticsearch-es-masters.elastic-system.svc.cluster.local,elasticsearch-es-transport.elastic-system.svc.cluster.local"
    - name: data
      count: 2
      config:
        node.roles: ["data", "ingest"]
        node.store.allow_mmap: false
        action.auto_create_index: true
        xpack.security.transport.ssl.key: /usr/share/elasticsearch/config/cert-manager-certs/tls.key
        xpack.security.transport.ssl.certificate: /usr/share/elasticsearch/config/cert-manager-certs/tls.crt
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
            storageClassName: longhorn
      podTemplate:
        spec:
          securityContext:
            fsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: elasticsearch
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms2g -Xmx2g"
              volumeMounts:
                - name: transport-certs
                  mountPath: /usr/share/elasticsearch/config/cert-manager-certs
                  readOnly: true
          volumes:
            - name: transport-certs
              csi:
                driver: csi.cert-manager.io
                readOnly: true
                volumeAttributes:
                  csi.cert-manager.io/issuer-name: internal-ca
                  csi.cert-manager.io/issuer-kind: ClusterIssuer
                  csi.cert-manager.io/dns-names: "*.elasticsearch-es-data.elastic-system.svc.cluster.local,elasticsearch-es-transport.elastic-system.svc.cluster.local"
