global:
  clusterName: talos-homelab
  storageClass: longhorn

signoz:
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
  ingress:
    enabled: false
  service:
    type: ClusterIP
  persistence:
    enabled: true
    size: 2Gi
  env:
    signoz_alertmanager_signoz_external__url: https://signoz.home.arpa

clickhouse:
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9363"
    prometheus.io/path: /metrics
  persistence:
    enabled: true
    size: 50Gi
  layout:
    shardsCount: 1
    replicasCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      memory: 4Gi
  # Cold start on Longhorn loads system.* log tables before /ping answers; widen
  # the probe and load them asynchronously.
  startupProbe:
    failureThreshold: 360
  settings:
    async_load_system_database: "true"
    # Default trace level fills the volume and starves merges.
    text_log/level: warning
  zookeeper:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9141"
      prometheus.io/path: /metrics
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        memory: 768Mi
  clickhouseOperator:
    traceLog:
      ttl: 1
    metricLog:
      ttl: 3
    asynchronousMetricLog:
      ttl: 3
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8888"


otelCollector:
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 512Mi
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8888"
  service:
    type: ClusterIP
