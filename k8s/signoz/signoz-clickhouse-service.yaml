---
apiVersion: v1
kind: Service
metadata:
  name: signoz-clickhouse
  namespace: signoz
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8123
      protocol: TCP
      targetPort: 8123
    - name: tcp
      port: 9000
      protocol: TCP
      targetPort: 9000
  selector:
    clickhouse.altinity.com/app: chop
    clickhouse.altinity.com/chi: signoz-clickhouse
    clickhouse.altinity.com/namespace: signoz
