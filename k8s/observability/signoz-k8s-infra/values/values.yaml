global:
  clusterName: talos-homelab
  storageClass: longhorn

clusterName: talos-homelab
namespace: signoz
otelCollectorEndpoint: signoz-otel-collector.signoz.svc.cluster.local:4317
otelInsecure: true

presets:
  otlpExporter:
    enabled: true
  otlphttpExporter:
    enabled: false
  logsCollection:
    enabled: true
    blacklist:
      enabled: false
    whitelist:
      enabled: true
      signozLogs: true
      namespaces:
        - argocd
        - cert-manager
        - elastic-system
        - external-secrets
        - gateway-internal
        - gateway-public
        - kube-system
        - longhorn-system
        - monitoring
        - signoz
  hostMetrics:
    enabled: true
  kubeletMetrics:
    enabled: true
  clusterMetrics:
    enabled: true
  k8sEvents:
    enabled: true
  prometheus:
    enabled: true
    annotationsPrefix: prometheus.io
    scrapeInterval: 30s
    namespaces: []
    scrapeConfigs:
      - job_name: signoz-annotated-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_signoz_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_signoz_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_signoz_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
      - job_name: prometheus-annotated-services
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: service

otelAgent:
  hostNetwork: false
  ports:
    otlp:
      enabled: false
      hostPort: null
    otlp-http:
      enabled: false
      hostPort: null
    zipkin:
      enabled: false
      hostPort: null
    metrics:
      enabled: true
      hostPort: null
    zpages:
      enabled: false
      hostPort: null
    health-check:
      enabled: true
      hostPort: null
    pprof:
      enabled: false
      hostPort: null

otelDeployment:
  ports:
    metrics:
      enabled: true
    health-check:
      enabled: true
