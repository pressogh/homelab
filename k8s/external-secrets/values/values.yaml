replicaCount: 2

image:
  repository: ghcr.io/external-secrets/external-secrets
  pullPolicy: IfNotPresent
  tag: "v0.20.2"

installCRDs: true

crds:
  createClusterExternalSecret: true
  createClusterSecretStore: true
  createPushSecret: true

processClusterExternalSecret: true
processClusterStore: true
processPushSecret: true
processClusterPushSecret: true

leaderElect: true

securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

serviceAccount:
  create: true
  automount: true

rbac:
  create: true
  aggregateToEdit: true
  aggregateToView: true

metrics:
  service:
    enabled: true
    port: 8080

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 25s

webhook:
  port: 10250
  certCheckInterval: "5m"

  certManager:
    enabled: true
    addInjectorAnnotations: true
    cert:
      create: true
      duration: "8760h"
      renewBefore: "720h"
      issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: internal-ca

podDisruptionBudget:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - external-secrets
          topologyKey: kubernetes.io/hostname

log:
  level: info
  timeEncoding: epoch

extendedMetricLabels: true