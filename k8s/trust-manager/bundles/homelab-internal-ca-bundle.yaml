apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: internal-root-ca-bundle
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  sources:
    - secret:
        name: internal-root-ca
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        trust.cert-manager.io/inject: "true"
