apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
  namespace: openbao
spec:
  secretName: openbao-tls
  duration: 2160h
  renewBefore: 360h
  subject:
    organizations:
      - homelab
  commonName: openbao.openbao.svc.cluster.local
  dnsNames:
    - openbao
    - openbao.openbao
    - openbao.openbao.svc
    - openbao.openbao.svc.cluster.local
    - openbao-active
    - openbao-standby
    - "*.openbao-internal"
    - "*.openbao-internal.openbao.svc.cluster.local"
  usages:
    - server auth
    - client auth
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
    group: cert-manager.io