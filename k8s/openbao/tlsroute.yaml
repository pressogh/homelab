apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: openbao-route
  namespace: openbao
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-gw
      namespace: gateway-internal
      sectionName: https-wild-passthrough
  hostnames:
    - openbao.home.arpa
  rules:
    - backendRefs:
      - group: ""
        kind: Service
        name: openbao-ui
        port: 8200
        weight: 1