name: Terraform Lint

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'terraform/**/*.tf'
      - 'terraform/**/*.tfvars'
      - '.tflint.hcl'
      - '.github/workflows/terraform-lint.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate tofu configuration
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: tofu validate
        uses: dflook/tofu-validate@v3
        with:
          path: terraform

  fmt-check:
    runs-on: ubuntu-latest
    name: Check formatting of tofu files
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: tofu fmt
        uses: dflook/tofu-fmt-check@v3
        with:
          path: terraform
