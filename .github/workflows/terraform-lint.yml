name: Terraform Lint and Format
on:
  push:
    paths:
      - 'terraform/**/*.tf'
      - 'terraform/**/*.tfvars'
      - '.tflint.hcl'
      - '.github/workflows/terraform-lint.yml'
  pull_request:
    paths:
      - 'terraform/**/*.tf'
      - 'terraform/**/*.tfvars'
      - '.tflint.hcl'

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache TFLint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5
        with:
          tflint_version: v0.59.1

      - name: Initialize TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint --format compact --recursive
        working-directory: terraform

  format:
    name: OpenTofu Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6

      - name: Check OpenTofu formatting
        id: fmt
        run: tofu fmt -check -recursive -diff
        working-directory: terraform
        continue-on-error: true

      - name: Apply OpenTofu formatting
        if: steps.fmt.outcome == 'failure'
        run: tofu fmt -recursive
        working-directory: terraform

      - name: Commit formatting changes
        if: steps.fmt.outcome == 'failure' && github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add terraform/
          git diff --cached --quiet || git commit -m "chore: auto-format terraform files [skip ci]"
          git push

      - name: Comment on PR with formatting changes
        if: steps.fmt.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ OpenTofu formatting issues were detected. Please run `tofu fmt -recursive` in the `terraform/` directory locally and commit the changes.'
            })