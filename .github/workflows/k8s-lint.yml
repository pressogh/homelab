name: Kubernetes YAML Lint and Format

on:
  pull_request:
    paths:
      - 'k8s/**/*.yaml'
      - 'k8s/**/*.yml'
      - '.github/workflows/k8s-lint.yml'
      - '.config/.yamlfmt'
      - '.config/.yamllint'

permissions:
  contents: write
  pull-requests: write

env:
  KUBECONFORM_VERSION: v0.7.0
  YAMLFMT_VERSION: 0.17.2

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-yamllint-${{ runner.os }}
          restore-keys: |
            pip-yamllint-${{ runner.os }}-

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        id: yamllint
        run: |
          yamllint -c .config/.yamllint -f parsable k8s/ 2>&1 | tee yamllint-output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Comment on PR with yamllint errors
        if: steps.yamllint.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('yamllint-output.txt', 'utf8');
            const body = `## ❌ YAML Lint Errors

            \`\`\`
            ${output}
            \`\`\`

            Please fix the yamllint errors above and push your changes.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

  kubeconform:
    name: Kubernetes Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache Kubeconform binary
        id: cache-kubeconform
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/kubeconform
          key: kubeconform-${{ env.KUBECONFORM_VERSION }}-${{ runner.os }}

      - name: Setup Kubeconform
        if: steps.cache-kubeconform.outputs.cache-hit != 'true'
        run: |
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${{ env.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz"
          tar xf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
          rm kubeconform.tar.gz

      - name: Cache Kubeconform schemas
        uses: actions/cache@v4
        with:
          path: ~/.cache/kubeconform
          key: kubeconform-schemas-${{ hashFiles('k8s/**/*.yaml', 'k8s/**/*.yml') }}
          restore-keys: |
            kubeconform-schemas-

      - name: Create cache directory
        run: mkdir -p ~/.cache/kubeconform

      - name: Validate Kubernetes manifests
        id: kubeconform
        run: |
          kubeconform -summary -output text \
            -cache ~/.cache/kubeconform \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            -ignore-filename-pattern '/values/' \
            k8s/ 2>&1 | tee kubeconform-output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Comment on PR with kubeconform errors
        if: steps.kubeconform.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('kubeconform-output.txt', 'utf8');
            const body = `## ❌ Kubernetes Schema Validation Errors

            \`\`\`
            ${output}
            \`\`\`

            Please fix the kubeconform validation errors above and push your changes.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

  format:
    name: YAML Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache yamlfmt binary
        id: cache-yamlfmt
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/yamlfmt
          key: yamlfmt-${{ env.YAMLFMT_VERSION }}-${{ runner.os }}

      - name: Install yamlfmt
        if: steps.cache-yamlfmt.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/google/yamlfmt/releases/download/v${{ env.YAMLFMT_VERSION }}/yamlfmt_${{ env.YAMLFMT_VERSION }}_Linux_x86_64.tar.gz" | \
            sudo tar -xzv -C /usr/local/bin yamlfmt

      - name: Check YAML formatting
        id: fmt
        run: |
          yamlfmt -conf .config/.yamlfmt -lint k8s/**/*.yaml k8s/**/*.yml 2>&1 | tee yamlfmt-output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Comment on PR with formatting errors
        if: steps.fmt.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('yamlfmt-output.txt', 'utf8');
            const body = `## ⚠️ YAML Formatting Errors

            \`\`\`
            ${output}
            \`\`\`

            Please run \`yamlfmt -conf .config/.yamlfmt k8s/\` locally and commit the changes.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })