apiVersion: gateway.networking.k8s.io/v1alpha2
kind: HTTPRoute
metadata:
  name: elasticsearch-route
  namespace: elastic-system
spec:
  parentRefs:
    - name: public-gw
      namespace: gateway-public
  hostnames:
    - elasticsearch.presso.ac
  rules:
    - backendRefs:
      - name: elasticsearch-es-http
        port: 9200
