apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: elasticsearch-route
  namespace: elastic-system
spec:
  parentRefs:
    - name: internal-gw
      namespace: gateway-internal
      sectionName: es-tls
  hostnames:
    - es.home.arpa
  rules:
    - matches:
      - path:
        type: PathPrefix
        value: /
    - backendRefs:
      - name: elasticsearch-es-http
        port: 9200
