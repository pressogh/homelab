apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: elasticsearch-route
  namespace: elastic-system
  annotations:
    gateway.cilium.io/backend-protocol: "https"
spec:
  parentRefs:
    - name: public-gw
      namespace: gateway-public
  hostnames:
    - elasticsearch.presso.ac
  rules:
    - backendRefs:
      - name: elasticsearch-es-http
        port: 9200
