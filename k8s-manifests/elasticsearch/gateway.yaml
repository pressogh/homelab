apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: elasticsearch-route
  namespace: elastic-system
spec:
  parentRefs:
    - name: internal-gw
      namespace: gateway-internal
  hostnames:
    - es.home.arpa
  rules:
    - backendRefs:
      - name: elasticsearch-es-http
        port: 9200