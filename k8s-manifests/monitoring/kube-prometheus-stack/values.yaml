crds:
  enabled: true

alertmanager:
  enabled: true

  route:
    main:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      hostnames:
       - alertmanager.home.arpa
      parentRefs:
       - name: internal-gw
         namespace: gateway-internal
      httpsRedirect: true
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains; preload"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: X-Frame-Options
                value: "DENY"
      matches:
        - path:
            type: PathPrefix
            value: /

  alertmanagerSpec:
    image:
      registry: quay.io
      repository: prometheus/alertmanager
      tag: v0.28.1
      pullPolicy: IfNotPresent

    replicas: 2
    retention: 120h

    externalUrl: https://alertmanager.home.arpa

    storage:
     volumeClaimTemplate:
       spec:
         storageClassName: longhorn
         accessModes: ["ReadWriteOnce"]
         resources:
           requests:
             storage: 5Gi

    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        cpu: 400m
        memory: 800Mi

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

  serviceAccount:
    create: true
    automountServiceAccountToken: false

grafana:
  enabled: true

  defaultDashboardsTimezone: Asia/Seoul
  defaultDashboardsInterval: 1m

  adminUser: admin
  adminPassword: prom-operator

  ingress:
    enabled: false

  grafana.ini:
    server:
      domain: grafana.home.arpa
      root_url: https://grafana.home.arpa
      serve_from_sub_path: false
    security:
      cookie_secure: true
      allow_embedding: false
      disable_gravatar: true

  persistence:
    enabled: true
    type: sts
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    finalizers:
      - kubernetes.io/pvc-protection

  serviceMonitor:
    enabled: true

  serviceAccount:
    create: true
    automountServiceAccountToken: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  networkPolicy:
    enabled: true
    allowExternal: false

nodeExporter:
  enabled: true

  operatingSystems:
    linux:
      enabled: true
    aix:
      enabled: true
    darwin:
      enabled: true

  serviceAccount:
    create: true
    automountServiceAccountToken: false

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheusOperator:
  enabled: true

  revisionHistoryLimit: 10

  tls:
    enabled: true
    tlsMinVersion: VersionTLS13
    internalPort: 10250

  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true

  admissionWebhooks:
    enabled: true
    failurePolicy: ""
    timeoutSeconds: 10
    deployment:
      enabled: true
    patch:
      enabled: true
      image:
        registry: registry.k8s.io
        repository: ingress-nginx/kube-webhook-certgen
        tag: v1.6.3
      ttlSecondsAfterFinished: 60

  namespaces: {}
  denyNamespaces: []

  networkPolicy:
    enabled: true
    flavor: cilium
    cilium:
      endpointSelector: {}
      egress:
        - {}
      ingress:
        - {}

  serviceAccount:
    create: true
    automountServiceAccountToken: true

  serviceMonitor:
    selfMonitor: true

  env:
    GOGC: "30"

  image:
    registry: quay.io
    repository: prometheus-operator/prometheus-operator
    pullPolicy: IfNotPresent

  hostNetwork: false

  securityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ "ALL" ]

prometheus:
  enabled: true

  route:
    main:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      hostnames:
        - prometheus.home.arpa
      parentRefs:
        - name: internal-gw
          namespace: gateway-internal
      httpsRedirect: true
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains; preload"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: X-Frame-Options
                value: "DENY"

  service:
    enabled: true
    type: ClusterIP
    port: 9090

  ingress:
    enabled: false

  serviceMonitor:
    selfMonitor: true

  networkPolicy:
    enabled: true
    flavor: cilium
    cilium:
      endpointSelector: {}
      egress:
        - {}
      ingress:
        - {}

  prometheusSpec:
    image:
      registry: quay.io
      repository: prometheus/prometheus
      tag: v3.6.0

    replicas: 2
    shards: 1

    retention: 10d
    walCompression: true
    enableAdminAPI: false
    externalUrl: https://prometheus.home.arpa

    serviceDiscoveryRole: EndpointSlice

    externalLabels:
      cluster: talos-homelab
      env: homelab

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 30Gi

    ruleSelectorNilUsesHelmValues: true
    serviceMonitorSelectorNilUsesHelmValues: true
    podMonitorSelectorNilUsesHelmValues: true
    probeSelectorNilUsesHelmValues: true
    scrapeConfigSelectorNilUsesHelmValues: true

    securityContext:
      runAsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault

    automountServiceAccountToken: true

  servicePerReplica:
    enabled: false

thanosRuler:
  enabled: false

cleanPrometheusOperatorObjectNames: false

extraManifests:
  - |
    apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: allow-egress-to-apiserver-and-dns
      namespace: {{ .Release.Namespace }}
      annotations:
        helm.sh/hook: pre-install,pre-upgrade
        helm.sh/hook-weight: "-10"
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    spec:
      endpointSelector: {}
      egress:
        - toServices:
            - k8sService:
                namespace: default
                serviceName: kubernetes
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
        - toEntities:
            - kube-apiserver
          toPorts:
            - ports:
                - port: "6443"
                  protocol: TCP
                - port: "443"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: kube-system
                k8s:k8s-app: kube-dns
          toPorts:
            - ports:
                - port: "53"
                  protocol: UDP
                - port: "53"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: kube-system
                k8s:k8s-app: coredns
          toPorts:
            - ports:
                - port: "53"
                  protocol: UDP
                - port: "53"
                  protocol: TCP

  - |
    apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: prometheus-egress-allow
      namespace: {{ .Release.Namespace }}
    spec:
      endpointSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
      egress:
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: kube-system
                k8s:k8s-app: kube-dns
          toPorts:
            - ports:
                - port: "53"
                  protocol: UDP
                - port: "53"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: kube-system
                k8s:k8s-app: coredns
          toPorts:
            - ports:
                - port: "53"
                  protocol: UDP
                - port: "53"
                  protocol: TCP
        - toEntities:
            - remote-node
            - host
          toPorts:
            - ports:
                - port: "10250"
                  protocol: TCP
        - toEntities:
            - remote-node
            - host
          toPorts:
            - ports:
                - port: "9100"
                  protocol: TCP
        - toEntities:
            - kube-apiserver
          toPorts:
            - ports:
                - port: "6443"
                  protocol: TCP
                - port: "443"
                  protocol: TCP
                - port: "10257"
                  protocol: TCP
                - port: "10259"
                  protocol: TCP
        - toServices:
            - k8sService:
                namespace: default
                serviceName: kubernetes
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP

  - |
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: prometheus-allow-from-self
      namespace: {{ .Release.Namespace }}
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
      policyTypes: ["Ingress"]
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
          ports:
            - port: 9090
              protocol: TCP

  - |
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: grafana-allow-from-gateway
      namespace: {{ .Release.Namespace }}
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: grafana
      policyTypes: ["Ingress"]
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: gateway-internal
          ports:
            - port: 3000
              protocol: TCP

  - |
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: alertmanager-allow-from-gateway
      namespace: {{ .Release.Namespace }}
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: alertmanager
      policyTypes: ["Ingress"]
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: gateway-internal
          ports:
            - port: 9093
              protocol: TCP

  - |
    apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: alertmanager-egress-peering
      namespace: {{ .Release.Namespace }}
    spec:
      endpointSelector:
        matchLabels:
          app.kubernetes.io/name: alertmanager
      egress:
        - toEndpoints:
            - matchLabels:
                app.kubernetes.io/name: alertmanager
                io.cilium.k8s.namespace.name: {{ .Release.Namespace }}
          toPorts:
            - ports:
                - port: "9094"
                  protocol: TCP

  - |
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ksm-allow-from-prometheus
      namespace: {{ .Release.Namespace }}
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: kube-state-metrics
      policyTypes: ["Ingress"]
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
          ports:
            - port: 8080
              protocol: TCP

  - |
    apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: ksm-egress-apiserver
      namespace: {{ .Release.Namespace }}
    spec:
      endpointSelector:
        matchLabels:
          app.kubernetes.io/name: kube-state-metrics
      egress:
        - toEntities:
            - kube-apiserver
          toPorts:
            - ports:
                - port: "6443"
                  protocol: TCP
                - port: "443"
                  protocol: TCP

  - |
    apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: operator-egress-apiserver
      namespace: {{ .Release.Namespace }}
    spec:
      endpointSelector:
        matchLabels:
          app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
      egress:
        - toEntities:
            - kube-apiserver
          toPorts:
            - ports:
                - port: "6443"
                  protocol: TCP
                - port: "443"
                  protocol: TCP

  - |
    apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: operator-webhook-allow-from-apiserver-cilium
      namespace: {{ .Release.Namespace }}
    spec:
      endpointSelector:
        matchLabels:
          app.kubernetes.io/component: prometheus-operator-webhook
      ingress:
        - fromEntities:
            - kube-apiserver
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
