crds:
  enabled: true

alertmanager:
  enabled: true

  route:
    main:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      hostnames:
       - alertmanager.home.arpa
      parentRefs:
       - name: internal-gw
         namespace: gateway-internal
      httpsRedirect: true
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains; preload"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: X-Frame-Options
                value: "DENY"
      matches:
        - path:
            type: PathPrefix
            value: /

  alertmanagerSpec:
    image:
      registry: quay.io
      repository: prometheus/alertmanager
      tag: v0.28.1
      pullPolicy: IfNotPresent

    replicas: 2
    retention: 120h

    externalUrl: https://alertmanager.home.arpa

    storage:
     volumeClaimTemplate:
       spec:
         storageClassName: longhorn
         accessModes: ["ReadWriteOnce"]
         resources:
           requests:
             storage: 5Gi

    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        cpu: 400m
        memory: 800Mi

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

  serviceAccount:
    create: true
    automountServiceAccountToken: false

grafana:
  enabled: true

  defaultDashboardsTimezone: Asia/Seoul
  defaultDashboardsInterval: 1m

  adminUser: admin
  adminPassword: prom-operator

  ingress:
    enabled: false

  grafana.ini:
    server:
      domain: grafana.home.arpa
      root_url: https://grafana.home.arpa
      serve_from_sub_path: false
    security:
      cookie_secure: true
      allow_embedding: false
      disable_gravatar: true

  persistence:
    enabled: true
    type: sts
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    finalizers:
      - kubernetes.io/pvc-protection

  serviceMonitor:
    enabled: true

  serviceAccount:
    create: true
    automountServiceAccountToken: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  networkPolicy:
    enabled: true
    allowExternal: false

nodeExporter:
  enabled: true

  operatingSystems:
    linux:
      enabled: true
    aix:
      enabled: true
    darwin:
      enabled: true

  serviceAccount:
    create: true
    automountServiceAccountToken: false

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheusOperator:
  enabled: true

  revisionHistoryLimit: 10

  tls:
    enabled: true
    tlsMinVersion: VersionTLS13
    internalPort: 10250

  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true

  admissionWebhooks:
    enabled: true
    failurePolicy: ""
    timeoutSeconds: 10
    deployment:
      enabled: true
    patch:
      enabled: true
      image:
        registry: registry.k8s.io
        repository: ingress-nginx/kube-webhook-certgen
        tag: v1.6.3
      ttlSecondsAfterFinished: 60

  namespaces: {}
  denyNamespaces: []

  networkPolicy:
    enabled: true
    flavor: cilium
    cilium:
      endpointSelector: {}
      egress:
        - {}
      ingress:
        - {}

  serviceAccount:
    create: true
    automountServiceAccountToken: true

  serviceMonitor:
    selfMonitor: true

  env:
    GOGC: "30"

  image:
    registry: quay.io
    repository: prometheus-operator/prometheus-operator
    pullPolicy: IfNotPresent

  hostNetwork: false

  securityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ "ALL" ]

prometheus:
  enabled: true

  route:
    main:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      hostnames:
        - prometheus.home.arpa
      parentRefs:
        - name: internal-gw
          namespace: gateway-internal
      httpsRedirect: true
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains; preload"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: X-Frame-Options
                value: "DENY"

  service:
    enabled: true
    type: ClusterIP
    port: 9090

  ingress:
    enabled: false

  serviceMonitor:
    selfMonitor: true

  networkPolicy:
    enabled: true
    flavor: cilium
    cilium:
      endpointSelector: {}
      egress:
        - {}
      ingress:
        - {}

  prometheusSpec:
    image:
      registry: quay.io
      repository: prometheus/prometheus
      tag: v3.6.0

    replicas: 2
    shards: 1

    retention: 10d
    walCompression: true
    enableAdminAPI: false
    externalUrl: https://prometheus.home.arpa

    serviceDiscoveryRole: EndpointSlice

    externalLabels:
      cluster: talos-homelab
      env: homelab

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 30Gi

    ruleSelectorNilUsesHelmValues: true
    serviceMonitorSelectorNilUsesHelmValues: true
    podMonitorSelectorNilUsesHelmValues: true
    probeSelectorNilUsesHelmValues: true
    scrapeConfigSelectorNilUsesHelmValues: true

    securityContext:
      runAsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault

    automountServiceAccountToken: true

  servicePerReplica:
    enabled: false

thanosRuler:
  enabled: false

cleanPrometheusOperatorObjectNames: false

extraManifests:
  - |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: grafana
      namespace: {{ .Release.Namespace }}
      labels:
        app.kubernetes.io/part-of: monitoring
    spec:
      parentRefs:
        - name: internal-gw
          namespace: gateway-internal
      hostnames:
        - grafana.home.arpa
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          filters:
            - type: ResponseHeaderModifier
              responseHeaderModifier:
                add:
                  - name: Strict-Transport-Security
                    value: "max-age=31536000; includeSubDomains; preload"
                  - name: X-Content-Type-Options
                    value: "nosniff"
                  - name: X-Frame-Options
                    value: "DENY"
          backendRefs:
            - name: kube-prometheus-stack-grafana
              port: 80

  - |
    apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: allow-egress-core
      namespace: {{ .Release.Namespace }}
      annotations:
        helm.sh/hook: pre-install,pre-upgrade
        helm.sh/hook-weight: "-30"
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    spec:
      endpointSelector: {}
      egress:
        - toEntities:
            - kube-apiserver
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
                - port: "6443"
                  protocol: TCP
        - toServices:
            - k8sService:
                namespace: default
                serviceName: kubernetes
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: kube-system
                k8s:k8s-app: kube-dns
          toPorts:
            - ports:
                - port: "53"
                  protocol: UDP
                - port: "53"
                  protocol: TCP
                - port: "9153"
                  protocol: TCP
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: kube-system
                k8s:k8s-app: coredns
          toPorts:
            - ports:
                - port: "53"
                  protocol: UDP
                - port: "53"
                  protocol: TCP
                - port: "9153"
                  protocol: TCP
        - toEntities:
            - host
            - remote-node
          toPorts:
            - ports:
                - port: "10250"
                  protocol: TCP
                - port: "9100"
                  protocol: TCP

  - |
    apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: operator-webhook-allow-from-apiserver
      namespace: {{ .Release.Namespace }}
      annotations:
        helm.sh/hook: pre-install,pre-upgrade
        helm.sh/hook-weight: "-20"
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    spec:
      endpointSelector:
        matchLabels:
          app.kubernetes.io/component: prometheus-operator-webhook
      ingress:
        - fromEntities:
            - kube-apiserver
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP

  - |
    apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: grafana-allow-from-gateway
      namespace: {{ .Release.Namespace }}
      annotations:
        helm.sh/hook: pre-install,pre-upgrade
        helm.sh/hook-weight: "-10"
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    spec:
      endpointSelector:
        matchLabels:
          app.kubernetes.io/name: grafana
      ingress:
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: gateway-internal
          toPorts:
            - ports:
                - port: "3000"
                  protocol: TCP

  - |
    apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: prometheus-allow-from-gateway
      namespace: {{ .Release.Namespace }}
      annotations:
        helm.sh/hook: pre-install,pre-upgrade
        helm.sh/hook-weight: "-10"
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    spec:
      endpointSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
      ingress:
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: gateway-internal
          toPorts:
            - ports:
                - port: "9090"
                  protocol: TCP

  - |
    apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: alertmanager-allow-from-gateway
      namespace: {{ .Release.Namespace }}
      annotations:
        helm.sh/hook: pre-install,pre-upgrade
        helm.sh/hook-weight: "-10"
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    spec:
      endpointSelector:
        matchLabels:
          app.kubernetes.io/name: alertmanager
      ingress:
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: gateway-internal
          toPorts:
            - ports:
                - port: "9093"
                  protocol: TCP
