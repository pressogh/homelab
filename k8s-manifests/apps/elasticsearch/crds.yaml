apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://download.elastic.co/downloads/eck/3.1.0
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  syncPolicy:
    automated:
      prune: false
    syncOptions:
    - Replace=true