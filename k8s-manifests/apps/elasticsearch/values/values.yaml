global:
  storageClass: longhorn

master:
  masterOnly: false
  replicaCount: 3
  heapSize: 4096m
  resources:
    requests:
      cpu: 2
      memory: 4Gi
    limits:
      cpu: 4
      memory: 8Gi
  persistence:
    enabled: true
    size: 10Gi

data:
  replicaCount: 0
  persistence:
    enabled: false

coordinating:
  replicaCount: 0

sysctlImage:
  enabled: false

security:
  enabled: true
  elasticPassword: "P@ssw0rd$"
  tls:
    autoGenerated: true
    restEncryption: true