global:
  storageClass: longhorn

image:
  registry: docker.io
  repository: bitnamilegacy/elasticsearch
  tag: 8.18.0-debian-12-r0
  digest: ""

master:
  masterOnly: false
  replicaCount: 2
  heapSize: 1g
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  persistence:
    enabled: true
    size: 50Gi

data:
  replicaCount: 0
  persistence:
    enabled: false

coordinating:
  replicaCount: 0

sysctlImage:
  enabled: false

security:
  enabled: true
  elasticPassword: ""
  tls:
    autoGenerated: true
    restEncryption: false